services:
  - type: web
    name: lld-lab-backend
    env: node
    region: singapore
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lld-lab-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lld-lab-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://lld-lab-frontend.onrender.com

  - type: web
    name: lld-lab-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://lld-lab-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: lld-lab-db
    databaseName: lld_lab
    user: lld_user
    plan: free
    region: singapore

  - name: lld-lab-redis
    type: redis
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
